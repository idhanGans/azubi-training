# A generic, single database configuration.

[alembic]
# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,flask_migrate

[handlers]
keys = console

[formatters]
keys = generic

# ⚠️ INFO, nicht WARN — zweite Haelfte des #11924-Fixes (#12226).
# `fileConfig()` konfiguriert IMMER auch den Root-Logger neu: es setzt dessen
# Level auf genau diesen Wert und ersetzt seine Handler. Weil `_auto_migrate()`
# (app/__init__.py) die Migration IN-PROCESS beim App-Start faehrt, ueberschreibt
# das den `logging.basicConfig(level=INFO)` der App — mit `WARN` bleibt danach
# JEDE INFO-Zeile stumm, auch mit `disable_existing_loggers=False` in env.py.
# Die beiden Stufen wirken unabhaengig: Stufe 1 (env.py) verhindert nur das
# ABSCHALTEN der Logger, Stufe 2 (hier) haelt ihren LEVEL auf INFO. Gemessen:
# nur Stufe 1 -> disabled=False, effective=WARNING, 0 von 4 INFO-Zeilen kamen an.
# `sqlalchemy` steht separat weiter auf WARN, es entsteht also kein SQL-Rauschen.
[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_flask_migrate]
level = INFO
handlers =
qualname = flask_migrate

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
